name: Mobile release

# Ships konnect for iOS and Android through EAS on Expo's free plan (docs/plans/konnect-mobile.md,
# "Distribution and builds"): binaries are built with `eas build --local` on GitHub's runners, free
# for a public repo, and an over-the-air update (free) ships whenever the native code hasn't changed.
#
# - Preview, on each merge to main that touches the app or its libraries:
#   1. "Fingerprint": each platform's native fingerprint for the preview profile, against the
#      konnect-native/preview/<platform>/<fingerprint> tags that record which binaries exist (EAS
#      records no local build).
#   2. "Build iOS" / "Build Android", only for a fingerprint with no binary: a local preview build,
#      checked to embed that fingerprint, then submitted (TestFlight internal testing; Play's
#      internal track).
#   3. "Record": the tag of each platform built, pushed by a job that can write to the repo, holds
#      no Expo secret and installs nothing.
#   4. "Update": a signed eas update on the preview channel, built as the preview variant.
# - Production, by hand (workflow_dispatch), behind the app-stores environment (main only, Lee
#   approves): local production builds submitted to TestFlight and Play's internal track, or with
#   update-only, an update on the production channel. Promoting to the stores is done in their
#   consoles.
#
# Every step is an Nx target of @konjir/konnect-mobile, but the Record jobs', which run
# scripts/native.mjs directly. EXPO_TOKEN lives only in the app-preview and app-stores
# environments, both limited to main, and is read only on push to main or
# workflow_dispatch, never on a pull request. Checkouts keep no credentials but the Record jobs',
# which push the tag: they hold no Expo secret, install nothing and run native.mjs, which uses only
# Node's own modules, on the runner's Node. Actions are pinned to commit SHAs, dependencies are
# installed without install scripts, and the local build plugin is the locked devDependency.
#
# Android ships only once the repository variable KONNECT_ANDROID is `on` (Settings, Secrets and
# variables, Actions, Variables), set when Play's apps, the upload keystore and the FCM key exist
# (apps/konnect-mobile/README.md, Release setup). Until then iOS ships alone: no Android binary is
# built, and an Android leg that would fail never holds back the iOS update.

on:
  push:
    branches: [main]
    paths:
      - apps/konnect-mobile/**
      - libs/brand/**
      - libs/types/**
      - package-lock.json
      - .github/workflows/mobile-release.yml
  workflow_dispatch:
    inputs:
      update-only:
        description: 'A JavaScript-only fix: an over-the-air update on the production channel, no new binaries'
        type: boolean
        default: false
      message:
        description: 'What it ships (the update message)'
        type: string
        required: true

concurrency:
  group: mobile-release-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  fingerprint:
    name: Fingerprint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      node: ${{ steps.node.outputs.version }}
      ios: ${{ steps.check.outputs.ios_build }}
      android: ${{ vars.KONNECT_ANDROID == 'on' && steps.check.outputs.android_build || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read eas.json's Node version
        id: node
        run: echo "version=$(jq -r .build.base.node apps/konnect-mobile/eas.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        run: npx nx run @konjir/konnect-mobile:native-check --output-style=stream -- --profile preview --github-output

  build:
    name: Build ${{ matrix.platform }}
    needs: fingerprint
    if: needs.fingerprint.outputs.ios == 'true' || needs.fingerprint.outputs.android == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, runner: macos-15, artifact: konnect-preview.ipa }
          - { platform: android, runner: ubuntu-24.04, artifact: konnect-preview.aab }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: app-preview
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.done.outputs.ios }}
      android: ${{ steps.done.outputs.android }}
    steps:
      - name: Needed?
        id: needed
        env:
          WANT: ${{ matrix.platform == 'ios' && needs.fingerprint.outputs.ios || needs.fingerprint.outputs.android }}
        run: echo "build=$WANT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.needed.outputs.build == 'true'
        with:
          persist-credentials: false
      # The Xcode expo-modules-jsi's patch is made for (scripts/patch-expo-modules-jsi.mjs).
      - name: Select Xcode 26.2
        if: steps.needed.outputs.build == 'true' && matrix.platform == 'ios'
        run: |
          if [ ! -d /Applications/Xcode_26.2.app ]; then ls -d /Applications/Xcode*.app; echo "::error::Xcode 26.2 isn't on this runner image"; exit 1; fi
          sudo xcode-select -s /Applications/Xcode_26.2.app
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.needed.outputs.build == 'true' && matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.needed.outputs.build == 'true'
        with:
          node-version: ${{ needs.fingerprint.outputs.node }}
          cache: npm
      - if: steps.needed.outputs.build == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (local), check, submit
        if: steps.needed.outputs.build == 'true'
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Lee's Apple team, an individual's (not a secret): with it, eas submit can see to the
          # TestFlight internal group, which the App Store Connect key alone, holding no team, can't.
          EXPO_APPLE_TEAM_ID: 7Y8QD34KJQ
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ runner.temp }}/${{ matrix.artifact }}
        run: |
          export EAS_LOCAL_BUILD_PLUGIN_PATH="$GITHUB_WORKSPACE/node_modules/eas-cli-local-build-plugin/bin/run"
          npx nx run @konjir/konnect-mobile:build-preview-local --output-style=stream -- --platform "$PLATFORM" --output "$ARTIFACT"
          npx nx run @konjir/konnect-mobile:native-verify --output-style=stream -- --profile preview --platform "$PLATFORM" --artifact "$ARTIFACT" --github-output
          npx nx run @konjir/konnect-mobile:submit-preview --output-style=stream -- --platform "$PLATFORM" --path "$ARTIFACT"
      - name: Built
        id: done
        if: steps.needed.outputs.build == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: echo "$PLATFORM=$FINGERPRINT" >> "$GITHUB_OUTPUT"

  record:
    name: Record
    needs: [fingerprint, build]
    # Whichever platforms were built, verified and submitted, even if the other platform failed, so
    # a binary that reached testers is never left without its tag (and built again next time).
    if: always() && needs.fingerprint.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the konnect-native tags, and nothing else: no Expo secret here
    steps:
      # The one checkout that keeps its credentials, to push the tag. Nothing is installed: no
      # dependency's code runs here, only the runner's Node on native.mjs, which uses Node's own modules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Tag what was built
        env:
          IOS: ${{ needs.build.outputs.ios }}
          ANDROID: ${{ needs.build.outputs.android }}
        run: |
          if [ -n "$IOS" ]; then node apps/konnect-mobile/scripts/native.mjs tag --profile preview --platform ios --fingerprint "$IOS"; fi
          if [ -n "$ANDROID" ]; then node apps/konnect-mobile/scripts/native.mjs tag --profile preview --platform android --fingerprint "$ANDROID"; fi

  update:
    name: Update
    needs: [fingerprint, build, record]
    # After the builds that were needed; an update is free, and a new binary picks it up too.
    if: always() && needs.fingerprint.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: app-preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.fingerprint.outputs.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update the preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # One argument to eas-cli however it's worded (scripts/eas.mjs): never on Nx's command line.
          KONNECT_UPDATE_MESSAGE: main at ${{ github.sha }}
        run: npx nx run @konjir/konnect-mobile:update-preview --output-style=stream -- --non-interactive

  production:
    name: Production (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # The first leg is the one an update-only run publishes from (below).
        platform: ${{ fromJSON(vars.KONNECT_ANDROID == 'on' && '["android","ios"]' || '["ios"]') }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    environment: app-stores
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.done.outputs.ios }}
      android: ${{ steps.done.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read eas.json's Node version
        id: node
        run: echo "version=$(jq -r .build.base.node apps/konnect-mobile/eas.json)" >> "$GITHUB_OUTPUT"
      - name: Select Xcode 26.2
        if: matrix.platform == 'ios' && !inputs.update-only
        run: |
          if [ ! -d /Applications/Xcode_26.2.app ]; then ls -d /Applications/Xcode*.app; echo "::error::Xcode 26.2 isn't on this runner image"; exit 1; fi
          sudo xcode-select -s /Applications/Xcode_26.2.app
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'android' && !inputs.update-only
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (local), check, submit to TestFlight or Play's internal track
        if: ${{ !inputs.update-only }}
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Lee's Apple team, an individual's (not a secret): with it, eas submit can see to the
          # TestFlight internal group, which the App Store Connect key alone, holding no team, can't.
          EXPO_APPLE_TEAM_ID: 7Y8QD34KJQ
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ runner.temp }}/konnect.${{ matrix.platform == 'ios' && 'ipa' || 'aab' }}
        run: |
          export EAS_LOCAL_BUILD_PLUGIN_PATH="$GITHUB_WORKSPACE/node_modules/eas-cli-local-build-plugin/bin/run"
          npx nx run @konjir/konnect-mobile:build-production-local --output-style=stream -- --platform "$PLATFORM" --output "$ARTIFACT"
          npx nx run @konjir/konnect-mobile:native-verify --output-style=stream -- --profile production --platform "$PLATFORM" --artifact "$ARTIFACT" --github-output
          npx nx run @konjir/konnect-mobile:submit-production --output-style=stream -- --platform "$PLATFORM" --path "$ARTIFACT"
      - name: Built
        id: done
        if: ${{ !inputs.update-only }}
        env:
          PLATFORM: ${{ matrix.platform }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: echo "$PLATFORM=$FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Update the production channel
        # Once, from the matrix's first leg (Android's, on the cheaper runner, once it ships; iOS's
        # until then): an update carries both platforms' bundles. Chosen from the matrix itself, not
        # by reading KONNECT_ANDROID again, so the two can never disagree and publish nothing.
        if: inputs.update-only && strategy.job-index == 0
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Lee's words: from the environment, never on Nx's command line, where a shell would read them.
          KONNECT_UPDATE_MESSAGE: ${{ inputs.message }}
        run: npx nx run @konjir/konnect-mobile:update-production --output-style=stream -- --non-interactive

  record-production:
    name: Record production
    needs: production
    # Whichever platforms were built, verified and submitted, even if the other platform failed.
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.update-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the konnect-native tags, and nothing else: no Expo secret here
    steps:
      # As Record: credentials kept to push the tag, and nothing installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Tag what was built
        env:
          IOS: ${{ needs.production.outputs.ios }}
          ANDROID: ${{ needs.production.outputs.android }}
        run: |
          if [ -n "$IOS" ]; then node apps/konnect-mobile/scripts/native.mjs tag --profile production --platform ios --fingerprint "$IOS"; fi
          if [ -n "$ANDROID" ]; then node apps/konnect-mobile/scripts/native.mjs tag --profile production --platform android --fingerprint "$ANDROID"; fi
