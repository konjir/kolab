name: Mobile release

# Ships konnect for iOS and Android through EAS on Expo's free plan (docs/plans/konnect-mobile.md,
# "Distribution and builds"): binaries are built with `eas build --local` on GitHub's runners, free
# for a public repo, rather than on EAS's 15 + 15 cloud builds a month, and an over-the-air update
# (free) ships whenever the native code hasn't changed.
#
# - Preview, on each merge to main that touches the app or its libraries:
#   1. "Fingerprint": each platform's native fingerprint for the preview profile, against the
#      konnect-native/preview/<platform>/<fingerprint> tags that record which binaries exist (EAS
#      records no local build).
#   2. "Build iOS" / "Build Android", only for a fingerprint with no binary: a local preview build,
#      submitted (TestFlight internal testing; Play's internal track), then tagged.
#   3. "Update": eas update on the preview channel, which every preview binary of the same
#      fingerprint picks up.
# - Production, by hand (workflow_dispatch), behind the app-stores environment (Lee approves): local
#   production builds submitted to TestFlight and Play's internal track, or with update-only, an
#   update on the production channel. Promoting to the stores is done in their consoles.
#
# Every step is an Nx target of @konjir/konnect-mobile. EXPO_TOKEN lives only in the app-preview
# (main only) and app-stores environments, used only on push to main or workflow_dispatch, never on
# a pull request, so a fork's run gets nothing. Actions are pinned to commit SHAs, dependencies are
# installed without install scripts, and each job holds only the permissions it needs.

on:
  push:
    branches: [main]
    paths:
      - apps/konnect-mobile/**
      - libs/brand/**
      - libs/types/**
      - package-lock.json
      - .github/workflows/mobile-release.yml
  workflow_dispatch:
    inputs:
      update-only:
        description: 'A JavaScript-only fix: an over-the-air update on the production channel, no new binaries'
        type: boolean
        default: false
      message:
        description: 'What it ships (the update message)'
        type: string
        required: true

concurrency:
  group: mobile-release-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NODE_VERSION: '22.23.3' # eas.json's, which mobile.yml checks against production's

jobs:
  fingerprint:
    name: Fingerprint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.check.outputs.ios_build }}
      android: ${{ steps.check.outputs.android_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        run: npx nx run @konjir/konnect-mobile:native-check --output-style=stream -- --profile preview --github-output

  build-ios:
    name: Build iOS
    needs: fingerprint
    if: needs.fingerprint.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-preview
    permissions:
      contents: write # the konnect-native tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Xcode expo-modules-jsi's patch is made for (scripts/patch-expo-modules-jsi.mjs).
      - name: Select Xcode 26.2
        run: |
          if [ ! -d /Applications/Xcode_26.2.app ]; then ls -d /Applications/Xcode*.app; echo "::error::Xcode 26.2 isn't on this runner image"; exit 1; fi
          sudo xcode-select -s /Applications/Xcode_26.2.app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (local), submit to TestFlight, record
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx nx run @konjir/konnect-mobile:build-preview-local --output-style=stream -- --platform ios --output "$RUNNER_TEMP/konnect-preview.ipa"
          npx nx run @konjir/konnect-mobile:submit-preview --output-style=stream -- --platform ios --path "$RUNNER_TEMP/konnect-preview.ipa"
          npx nx run @konjir/konnect-mobile:native-tag --output-style=stream -- --profile preview --platform ios

  build-android:
    name: Build Android
    needs: fingerprint
    if: needs.fingerprint.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: app-preview
    permissions:
      contents: write # the konnect-native tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (local), submit to Play's internal track, record
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx nx run @konjir/konnect-mobile:build-preview-local --output-style=stream -- --platform android --output "$RUNNER_TEMP/konnect-preview.aab"
          npx nx run @konjir/konnect-mobile:submit-preview --output-style=stream -- --platform android --path "$RUNNER_TEMP/konnect-preview.aab"
          npx nx run @konjir/konnect-mobile:native-tag --output-style=stream -- --profile preview --platform android

  update:
    name: Update
    needs: [fingerprint, build-ios, build-android]
    # After the builds that were needed; an update is free, and a new binary picks it up too.
    if: always() && needs.fingerprint.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: app-preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update the preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: npx nx run @konjir/konnect-mobile:update-preview --output-style=stream -- --message "main at $COMMIT" --non-interactive

  production:
    name: Production (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ios
            runner: macos-15
            artifact: konnect.ipa
          - platform: android
            runner: ubuntu-24.04
            artifact: konnect.aab
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: app-stores
    permissions:
      contents: write # the konnect-native tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.2
        if: matrix.platform == 'ios' && !inputs.update-only
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'android' && !inputs.update-only
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (local), submit to TestFlight or Play's internal track, record
        if: ${{ !inputs.update-only }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          npx nx run @konjir/konnect-mobile:build-production-local --output-style=stream -- --platform "$PLATFORM" --output "$RUNNER_TEMP/$ARTIFACT"
          npx nx run @konjir/konnect-mobile:submit-production --output-style=stream -- --platform "$PLATFORM" --path "$RUNNER_TEMP/$ARTIFACT"
          npx nx run @konjir/konnect-mobile:native-tag --output-style=stream -- --profile production --platform "$PLATFORM"
      - name: Update the production channel
        # Once, from the Android leg: an update carries both platforms' bundles.
        if: inputs.update-only && matrix.platform == 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: npx nx run @konjir/konnect-mobile:update-production --output-style=stream -- --message "$MESSAGE" --non-interactive
