name: CI

# Checks every pull request into main, and main after each merge (W2.4, binding element TST3).
# Two jobs, so a pull request shows two checks:
# - "Test on PGlite": typecheck, build and the Jest suite, on embedded Postgres (PGlite)
# - "Test on Postgres": the Jest suite again, on Postgres 18 through Testcontainers, as a
#   non-superuser like RDS's (jest.global-setup.js). The runner's Docker hosts the container.
#
# Both run as production does: on arm64 (the instance is a t4g, Graviton), with the Node version
# production installs, read from node_version in deploy/terraform/modules/kolab/main.tf. The
# runner image is pinned, so a new ubuntu-latest can't turn a pull request red.
#
# Nx prints each task's output (--output-style=static), so the log shows Jest's results.
#
# Each job runs only the projects the change affects (nx affected). On a pull request the base
# is where the branch left main; on main it is the last commit whose CI run passed
# (nrwl/nx-set-shas). This file and the terraform file the Node version comes from are in nx.json's
# sharedGlobals, so changing either runs everything.
#
# Hardening: a read-only token and no secrets, actions pinned to commit SHAs, and dependencies
# installed without install scripts, as deploy/release/install.sh does. There is no Nx Cloud.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  pglite:
    name: Test on PGlite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # nx-set-shas looks up main's last passing run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Typecheck, build and test
        run: npx nx affected -t typecheck build test --output-style=static

  postgres:
    name: Test on Postgres
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # nx-set-shas looks up main's last passing run
    env:
      KONJIR_TEST_POSTGRES: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # The cli's tests build first (a start test runs the compiled CLI); Nx runs that build.
      - name: Test
        run: npx nx affected -t test --output-style=static

      # Evidence in the log that Testcontainers pulled Postgres 18 and Ryuk into the runner's
      # Docker, for arm64. (The global teardown removes the containers themselves.)
      - name: Show the images the tests ran on
        if: always()
        run: docker image inspect --format '{{.RepoTags}} {{.Os}}/{{.Architecture}}' $(docker image ls -q --filter reference='postgres:*' --filter reference='testcontainers/*')
