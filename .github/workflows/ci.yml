name: CI

# Checks every pull request into main, and main after each merge (W2.4, W2.9, binding element TST3).
# Three jobs, so a pull request shows three checks, all of which main requires (D45):
# - "Test on PGlite": typecheck, build and the Jest suite, on embedded Postgres (PGlite)
# - "Test on Postgres": the Jest suite again, on Postgres 18 through Testcontainers, as a
#   non-superuser like RDS's (jest.global-setup.js). The runner's Docker hosts the container.
# - "Check Terraform": terraform fmt -check and terraform validate on deploy/terraform. It runs on
#   every change, not only ones under deploy/, so it can be required: a required check that a path
#   filter skips never reports, and the pull request waits for it forever.
#
# The two test jobs run as production does: on arm64 (the instance is a t4g, Graviton), with the
# Node version production installs, read from node_version in deploy/terraform/modules/kolab/main.tf.
# The runner image is pinned, so a new ubuntu-latest can't turn a pull request red.
#
# Nx prints each task's output (--output-style=static), so the log shows Jest's results.
#
# Each test job runs only the projects the change affects (nx affected). On a pull request the
# base is where the branch left main; on main it is the last commit whose CI run passed
# (nrwl/nx-set-shas). This file and the terraform file the Node version comes from are in nx.json's
# sharedGlobals, so changing either runs everything.
#
# Hardening: a read-only token and no secrets, actions pinned to commit SHAs, and dependencies
# installed without install scripts, as deploy/release/install.sh does. There is no Nx Cloud.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  pglite:
    name: Test on PGlite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # nx-set-shas looks up main's last passing run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Typecheck, build and test
        run: npx nx affected -t typecheck build test --output-style=static

  postgres:
    name: Test on Postgres
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # nx-set-shas looks up main's last passing run
    env:
      KONJIR_TEST_POSTGRES: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # The cli's tests build first (a start test runs the compiled CLI); Nx runs that build.
      - name: Test
        run: npx nx affected -t test --output-style=static

      # Evidence in the log that Testcontainers pulled Postgres 18 and Ryuk into the runner's
      # Docker, for arm64. (The global teardown removes the containers themselves.)
      - name: Show the images the tests ran on
        if: always()
        run: docker image inspect --format '{{.RepoTags}} {{.Os}}/{{.Architecture}}' $(docker image ls -q --filter reference='postgres:*' --filter reference='testcontainers/*')

  terraform:
    name: Check Terraform
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version Lee deploys with (README.md); versions.tf requires 1.15 or later.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      # No AWS credentials, and none needed: -backend=false skips the S3 state, init only downloads
      # the providers .terraform.lock.hcl pins (and fails if the lock file would change), and
      # validate checks the configuration without configuring a provider or reading a data source.
      # The lock file carries each provider's checksums for linux_arm64 as well as darwin_arm64
      # (terraform providers lock -platform=...), or validate here rejects the providers.
      - name: terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate
