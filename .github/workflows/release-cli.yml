name: Release CLI

# Publishes konjir (W2.6, binding element API6): the npm package, and a GitHub release named
# konjir@<version> with the single-file binaries. Lee runs it by hand from main
# (Actions > Release CLI > Run workflow). It never runs on its own.
#
# Four jobs, each with only the permissions it needs:
# 1. "Build konjir release" (read-only): validates the version, sets it in the runner, refuses a
#    version npm or a tag already has, builds the npm tarball and the binaries, checks both carry
#    LICENSE (Apache-2.0) and the third-party notices and reach a
#    Kolab started from the checkout, runs npm publish --dry-run on the tarball, and uploads the
#    files as an artifact. It is the only job that installs dependencies or runs Bun.
# 2. "Draft GitHub release" (contents, attestations): attests the files' build provenance and
#    creates the release as a draft, with the files and generated notes. A draft has no tag yet.
# 3. "Publish konjir to npm" (id-token, the npm-release environment): publishes the tarball the
#    first job tested, byte for byte, with provenance. No checkout and no dependencies.
# 4. "Publish GitHub release" (contents): takes the draft out of draft, which creates the tag
#    konjir@<version> on the commit the run built. The next run reads the version from that tag.
# With dry-run on (the default), only the first job runs.
#
# Set up once (README, "Releasing the CLI"): a GitHub environment named npm-release whose
# deployment branches are main only, and npm trusted publishing for konjir (this repository, this
# workflow, that environment), or else an NPM_TOKEN secret in that environment.
#
# Recovery: a run that stops before job 3 has published nothing; delete its draft release, if
# any, and run again. If job 3 published and job 4 failed, re-run job 4 ("Re-run failed jobs"),
# or run `gh release edit konjir@<version> --draft=false`. Never re-run job 1 for a version npm
# has: it refuses, by design.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: exact (0.6.0) or a bump (patch, minor, major). No prereleases.'
        required: true
        type: string
      dry-run:
        description: 'Dry run: build and check, publish nothing'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  build:
    name: Build konjir release
    # A convenience: the npm-release environment, limited to main, is the gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      node: ${{ steps.node.outputs.version }}

    steps:
      - name: Check the version input
        env:
          SPECIFIER: ${{ inputs.version }}
        run: |
          if [[ ! "$SPECIFIER" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::version must be patch, minor, major or X.Y.Z (got '$SPECIFIER')"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx release reads the newest konjir@* tag
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # The Bun apps/cli/bun-runtimes.json pins, checked against its sha256.
      - name: Install Bun
        run: dirname "$(node apps/cli/scripts/package.mjs bun "$RUNNER_TEMP/bun")" >> "$GITHUB_PATH"

      - name: Set the version
        id: version
        env:
          SPECIFIER: ${{ inputs.version }}
        run: |
          previous=$(git tag --list 'konjir@*' --sort=-v:refname | head -1)
          first=()
          [ -n "$previous" ] || first=(--first-release)
          npx nx release version "$SPECIFIER" "${first[@]}"
          version=$(node -p 'require("./apps/cli/package.json").version')
          if git rev-parse -q --verify "refs/tags/konjir@$version" >/dev/null; then
            echo "::error::the tag konjir@$version already exists"
            exit 1
          fi
          # npm view exits 0 with the version if it is published, and E404 if konjir or the version isn't.
          if published=$(npm view "konjir@$version" version 2>"$RUNNER_TEMP/npm-view.err"); then
            if [ -n "$published" ]; then
              echo "::error::npm already has konjir@$version"
              exit 1
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::couldn't ask npm whether konjir@$version exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Bundle for npm and compile the binaries
        run: npx nx run-many -t bundle compile -p konjir --skip-nx-cache --output-style=static

      - name: Pack the npm package and checksum the release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack ./apps/cli/dist-npm --pack-destination "$RUNNER_TEMP/release"
          cp apps/cli/dist-bin/* "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release" && sha256sum konjir-* LICENSE THIRD-PARTY-NOTICES.md > SHA256SUMS && cat SHA256SUMS

      # konjir is Apache-2.0: the tarball and the release's binaries carry LICENSE and the third-party notices.
      - name: Check the licence ships
        run: apps/cli/scripts/check-licence.sh "$RUNNER_TEMP"/release/konjir-*.tgz "$RUNNER_TEMP/release"

      - name: Choose a throwaway admin token for the test Kolab
        run: |
          token=$(openssl rand -hex 18)
          echo "::add-mask::$token"
          echo "KONJIR_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "KONJIR_URL=http://127.0.0.1:7420/mcp" >> "$GITHUB_ENV"

      - name: Start a Kolab from the checkout; konjir reaches it as a binary and through npx
        run: |
          bin/konjir serve --port 7420 --data "$RUNNER_TEMP/kolab" --quiet > "$RUNNER_TEMP/kolab.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:7420/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7420/healthz >/dev/null || { echo "::error::Kolab didn't answer /healthz within 60 s"; cat "$RUNNER_TEMP/kolab.log"; exit 1; }
          apps/cli/scripts/smoke.sh smoke-binary apps/cli/dist-bin/konjir-linux-arm64
          smoke="$PWD/apps/cli/scripts/smoke.sh"
          tarball=$(ls "$RUNNER_TEMP"/release/konjir-*.tgz)
          mkdir -p "$RUNNER_TEMP/npx" && cd "$RUNNER_TEMP/npx"
          "$smoke" smoke-npx npm exec --yes --package="$tarball" -- konjir

      - name: npm publish --dry-run
        run: npm publish --dry-run "$RUNNER_TEMP"/release/konjir-*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konjir-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Draft GitHub release
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write # the draft release
      id-token: write # the attestations' Sigstore certificate
      attestations: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: konjir-release
          path: release

      - name: Refuse a version that already has a release, draft or not
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "konjir@$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release konjir@$VERSION already exists (perhaps a draft from an earlier run); delete it or finish it"
            exit 1
          fi

      # Users can check a download with: gh attestation verify <file> --repo konjir/kolab
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/konjir-*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
        run: |
          since=()
          [ -n "$PREVIOUS" ] && since=(--notes-start-tag "$PREVIOUS")
          gh release create "konjir@$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "konjir $VERSION" --generate-notes "${since[@]}"

  publish:
    name: Publish konjir to npm
    needs: [build, draft]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # Holds the npm credentials: trusted publishing for this workflow and environment, or an
    # NPM_TOKEN secret. Its deployment branches must be main only.
    environment: npm-release
    permissions:
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: konjir-release
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1 --no-audit --no-fund

      - name: Check the tarball is the one the build tested
        working-directory: release
        run: grep ' konjir-.*\.tgz$' SHA256SUMS | sha256sum -c -

      - name: npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # With trusted publishing set up, npm uses this job's OIDC token and needs no secret.
          # The token, if set, is read from the environment; it is never written to disk.
          if [ -n "$NPM_TOKEN" ]; then
            # shellcheck disable=SC2016 # npm expands ${NPM_TOKEN} itself
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          npm publish "release/konjir-$VERSION.tgz" --provenance --access public --tag latest

  release:
    name: Publish GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write # take the release out of draft, which creates its tag

    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release edit "konjir@$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
