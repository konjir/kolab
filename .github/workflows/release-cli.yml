name: Release CLI

# Publishes konjir (W2.6, binding element API6): the npm package, and a GitHub release named
# konjir@<version> with the single-file binaries attached. Lee runs it by hand from main
# (Actions > Release CLI > Run workflow). It never runs on its own.
#
# It needs the repository secret NPM_TOKEN: an npm automation (or granular) token allowed to
# publish konjir. Without it the job stops before building anything.
#
# Inputs:
# - version: what nx release version applies, an exact version (0.6.0) or a bump (patch, minor).
#   A bump applies to the newest konjir@* tag; before the first release there is none, and
#   apps/cli/package.json's version is used instead.
# - dry-run: true (the default) builds, checks and runs npm publish --dry-run, and creates no
#   release. Run it once that way, then again with dry-run off.
#
# The version is set in the runner only: nothing is committed or pushed to main, which requires
# pull requests. The release's tag, created on the commit the run is on, records the version, and
# the next run reads it from there. The release notes are GitHub's, generated from the pull
# requests merged since the previous konjir@ tag; the repository's commits aren't conventional
# commits, so nx release writes no changelog.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: exact (0.6.0) or a bump (patch, minor, major)'
        required: true
        type: string
      dry-run:
        description: 'Dry run: build and check, publish nothing'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions: {}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  release:
    name: Release konjir CLI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      id-token: write # npm provenance

    steps:
      - name: Check for the npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add the repository secret NPM_TOKEN (an npm token that may publish konjir) before releasing."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx release reads the newest konjir@* tag
          persist-credentials: false

      - name: Read production's Node version
        id: node
        run: |
          version=$(sed -n '/^variable "node_version"/,/^}/s/^ *default *= *"\([0-9.]*\)".*/\1/p' deploy/terraform/modules/kolab/main.tf)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=deploy/terraform/modules/kolab/main.tf::can't read node_version's default (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/cli/.bun-version

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set the version
        id: version
        env:
          SPECIFIER: ${{ inputs.version }}
        run: |
          first=()
          git tag --list 'konjir@*' | grep -q . || first=(--first-release)
          npx nx release version "$SPECIFIER" "${first[@]}"
          version=$(node -p 'require("./apps/cli/package.json").version')
          if git rev-parse -q --verify "refs/tags/konjir@$version" >/dev/null; then
            echo "::error::konjir@$version is already released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "first=${first[*]}" >> "$GITHUB_OUTPUT"

      - name: Bundle for npm and compile the binaries
        run: npx nx run-many -t bundle compile -p konjir --skip-nx-cache --output-style=static

      - name: Pack the npm package and checksum the release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack ./apps/cli/dist-npm --pack-destination "$RUNNER_TEMP/release"
          cp apps/cli/dist-bin/* "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release" && sha256sum konjir-* > SHA256SUMS && cat SHA256SUMS

      - name: Choose a throwaway admin token for the test Kolab
        run: |
          token=$(openssl rand -hex 18)
          echo "::add-mask::$token"
          echo "KONJIR_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "KONJIR_URL=http://127.0.0.1:7420/mcp" >> "$GITHUB_ENV"

      - name: Start a Kolab from the checkout; konjir reaches it as a binary and through npx
        run: |
          bin/konjir serve --port 7420 --data "$RUNNER_TEMP/kolab" --quiet > "$RUNNER_TEMP/kolab.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:7420/healthz >/dev/null && break; sleep 1; done
          apps/cli/scripts/smoke.sh smoke-binary apps/cli/dist-bin/konjir-linux-arm64
          smoke="$PWD/apps/cli/scripts/smoke.sh"
          tarball=$(ls "$RUNNER_TEMP"/release/konjir-*.tgz)
          mkdir -p "$RUNNER_TEMP/npx" && cd "$RUNNER_TEMP/npx"
          "$smoke" smoke-npx npm exec --yes --package="$tarball" -- konjir

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          DRY_RUN: ${{ inputs.dry-run }}
          FIRST: ${{ steps.version.outputs.first }}
        run: |
          flags=()
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          [ -n "$FIRST" ] && flags+=(--first-release)
          npx nx release publish "${flags[@]}" --output-style=static

      - name: Create the GitHub release with the binaries
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          since=()
          previous=$(git tag --list 'konjir@*' --sort=-v:refname | head -1)
          [ -n "$previous" ] && since=(--notes-start-tag "$previous")
          gh release create "konjir@$VERSION" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "konjir $VERSION" --generate-notes "${since[@]}"
