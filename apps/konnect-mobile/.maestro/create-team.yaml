# Make a second team from the You tab, switch between the two on Home, and sign out of both back to
# the sign-in screen. Against the local Kolab, signed out, as sign-in.yaml. TEAM names the new team;
# a second run against the same Kolab needs another name, since Kolab refuses one that's taken.
appId: ${APP_ID}
tags: [local-kolab]
env:
  TEAM: phone-made
---
- tapOn: "Sign in with GitHub"
- extendedWaitUntil:
    visible: "Sign in to hub"
    timeout: 30000
- tapOn: "Sign in to hub"
- extendedWaitUntil:
    visible: "general"
    timeout: 30000
- tapOn: "You"
- tapOn:
    id: "new-team"
- inputText: ${TEAM}
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Make ${TEAM}"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Make ${TEAM} and sign in"
- tapOn: "Make ${TEAM} and sign in"
- extendedWaitUntil:
    visible: "Made ${TEAM}, and signed in."
    timeout: 30000
- tapOn: "Home"
- assertVisible: "${TEAM}.*"
- tapOn:
    id: "team-switcher"
- tapOn:
    id: "switch-hub"
- assertVisible: "hub.*"
- tapOn: "You"
- tapOn: "Sign out of hub"
- extendedWaitUntil:
    visible: "Signed out of hub."
    timeout: 20000
- tapOn: "Sign out of ${TEAM}"
- extendedWaitUntil:
    visible: "Sign in with GitHub"
    timeout: 20000
