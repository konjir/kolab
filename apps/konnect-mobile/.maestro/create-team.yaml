# Make a team from the team switcher, land in it, and sign out. Against the
# local Kolab, signed out, as sign-in.yaml. TEAM names the new team; a second run against the same
# Kolab needs another name, since Kolab refuses one that's taken.
appId: ${APP_ID}
tags: [local-kolab]
env:
  TEAM: phone-made
---
- runFlow: subflows/sign-in-ann.yaml
- tapOn:
    id: "team-switcher"
- tapOn:
    id: "new-team"
- inputText: ${TEAM}
- hideKeyboard
- tapOn:
    id: "create-team"
# Made in the app (konjir_make_team), then switched to.
- extendedWaitUntil:
    visible: "Teams: ${TEAM}.*"
    timeout: 30000
- tapOn: "You"
- assertVisible: ".*${TEAM}, .*"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in with GitHub"
    timeout: 20000
