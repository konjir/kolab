# Make a team from the team switcher, through Kolab's page, land in it, and sign out. Against the
# local Kolab, signed out, as sign-in.yaml. TEAM names the new team; a second run against the same
# Kolab needs another name, since Kolab refuses one that's taken.
appId: ${APP_ID}
tags: [local-kolab]
env:
  TEAM: phone-made
---
- tapOn: "Sign in with GitHub"
- extendedWaitUntil:
    visible: "Sign in to hub"
    timeout: 30000
- tapOn: "Sign in to hub"
- extendedWaitUntil:
    visible: "general.*"
    timeout: 30000
- tapOn:
    id: "team-switcher"
- tapOn:
    id: "new-team"
- inputText: ${TEAM}
- hideKeyboard
- tapOn:
    id: "create-team"
- extendedWaitUntil:
    visible: "Make ${TEAM}"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Make ${TEAM} and sign in"
- tapOn: "Make ${TEAM} and sign in"
- extendedWaitUntil:
    visible: "${TEAM}"
    timeout: 30000
- tapOn: "You"
- assertVisible: "${TEAM}.*"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in with GitHub"
    timeout: 20000
