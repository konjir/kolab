# The four tabs open, signed out: Home asks for a sign-in, DMs and Activity say they aren't built.
# APP_ID comes from scripts/e2e.mjs (APP_VARIANT); the app is open on its tabs.
appId: ${APP_ID}
---
- tapOn: "Home"
- assertVisible: "You aren't signed in to a team.*"
- tapOn: "DMs"
- assertVisible: "Not built yet.*"
- tapOn: "Activity"
- assertVisible: "Not built yet.*"
- tapOn: "You"
- assertVisible: "Not signed in to any team."
- tapOn: "Home"
