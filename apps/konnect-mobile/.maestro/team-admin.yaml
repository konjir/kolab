# Team settings: invite Cy (a GitHub account the local Kolab's stub knows), see the invitation, and
# withdraw it, then sign out: Ann, hub's owner, from signed out, against the local Kolab.
appId: ${APP_ID}
tags: [local-kolab]
---
- runFlow: subflows/sign-in-ann.yaml
- tapOn:
    id: "team-switcher"
- tapOn:
    id: "team-settings"
- tapOn:
    id: "invite"
- inputText: "cy"
- tapOn:
    id: "send-invite"
- extendedWaitUntil:
    visible: "Invited cy.*"
    timeout: 20000
- tapOn:
    id: "invitation-cy"
# The confirmation, before its button: a tap too soon lands on the row's own "withdraw".
- extendedWaitUntil:
    visible: "Withdraw cy's invitation\\?"
    timeout: 10000
# The dialog's button, not the row's own "withdraw" behind it, which matches the same words.
- tapOn:
    text: "Withdraw"
    below: "They won't be able to accept it\\."
- extendedWaitUntil:
    visible: "Withdrew cy's invitation."
    timeout: 20000
- assertVisible: "None waiting."
- tapOn: "Back"
- tapOn: "You"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
