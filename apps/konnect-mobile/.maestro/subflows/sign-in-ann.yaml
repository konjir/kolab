# From the sign-in screen to hub's Home, as Ann: Kolab's page is either the one tap ("Continue as
# @ann", for a person with teams and no invitation waiting) or the chooser (an invitation waits,
# as local-kolab's seed has one to ops), where Ann picks hub.
appId: ${APP_ID}
---
- tapOn: "Sign in with GitHub"
- extendedWaitUntil:
    visible: "Sign in to hub|Continue.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Sign in to hub"
    commands:
      - tapOn: "Sign in to hub"
- runFlow:
    when:
      visible: "Continue.*"
    commands:
      - tapOn: "Continue.*"
- extendedWaitUntil:
    visible: "general.*"
    timeout: 30000
