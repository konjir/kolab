# From the sign-in screen to hub's Home, as Ann. Kolab's page for the app is about the GitHub
# identity alone ("Continue as @ann"); the sign-in lands in the team Ann used last, or her first,
# and the switcher takes her to hub when that is another.
appId: ${APP_ID}
---
- tapOn: "Sign in with GitHub"
- extendedWaitUntil:
    visible: "Continue as @ann"
    timeout: 30000
# The button, below the page's words, not the heading that says the same.
- tapOn:
    text: "Continue as @ann"
    below: ".*renews itself.*"
- extendedWaitUntil:
    visible: "Teams: .*"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Teams: hub.*"
    commands:
      - tapOn:
          id: "team-switcher"
      - tapOn:
          id: "team-hub"
- extendedWaitUntil:
    visible: "Teams: hub.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "#?general.*"
    timeout: 30000
