# From the sign-in screen: one sign-in with GitHub through Kolab's page, the tabs, and signing this
# phone out back to the sign-in screen. Against a local Kolab (scripts/local-kolab.mts) whose stub
# identity provider signs anyone in as Ann, with the app open and signed out: a dev build, with
# `start` run with KONNECT_URL=http://127.0.0.1:7432/mcp. A person presses Kolab's button, as Maestro does.
appId: ${APP_ID}
tags: [local-kolab]
---
- assertVisible: "Sign in"
- assertNotVisible: "Home"
# The app talks to the local Kolab: a server chosen on this phone earlier (app/server.tsx) would
# send every flow elsewhere.
- assertVisible:
    id: "server-shown"
    text: "Server: 127.0.0.1:7432.*"
- runFlow: subflows/sign-in-ann.yaml
- assertVisible: "bo.*"
- tapOn: "DMs"
- tapOn: "Activity"
- tapOn: "You"
- assertVisible: "ann, signed in.*"
- assertVisible: ".*hub, product"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
